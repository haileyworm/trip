<style>
/* =========================================================
   🎨 風格設定：想換風格，改這一區就好
   ========================================================= */
:root{
  --paper:#FFFCF6;      /* 底色：和紙白 */
  --card:#FFFFFF;       /* 卡片底色 */
  --ink:#3E3A39;        /* 墨灰：線框與文字 */
  --coral:#F2A497;      /* 珊瑚粉 */
  --yellow:#F6D27A;     /* 山吹黃 */
  --water:#A8D3E6;      /* 水色 */
  --bamboo:#B9DAA5;     /* 若竹綠 */
  --muted:#8A8381;      /* 次要文字 */

  --line:3px;           /* 線框粗細 */
  --radius:24px;        /* 大圓角 */
  --radius-sm:14px;     /* 小圓角 */
  --pop:4px 4px 0 var(--ink); /* 平塗投影（不想要可改成 none） */
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --nav-h:104px;
}
/* ========================================================= */

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:.02em;padding-top:var(--nav-h)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-weight:normal;margin:0;line-height:1.3}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ---------- 頂部選單 ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;background:var(--paper);border-bottom:var(--line) solid var(--ink);padding-top:env(safe-area-inset-top)}
.nav-top{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto;padding:8px 16px 4px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none}
.brand-badge{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--yellow);border:var(--line) solid var(--ink);border-radius:12px}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.nav-links{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto;padding:4px 16px 10px;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{flex:none;text-decoration:none;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;font-size:14px;background:var(--card);transition:background .2s,transform .2s}
.nav-links a.on{background:var(--yellow);transform:translateY(-1px)}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:var(--line) solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .12s,box-shadow .12s;white-space:nowrap;text-decoration:none;font-size:15px}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.sm{padding:3px 10px;font-size:13px;border-width:2px;box-shadow:none}
.btn.coral{background:var(--coral)}.btn.yellow{background:var(--yellow)}.btn.water{background:var(--water)}.btn.bamboo{background:var(--bamboo)}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent;width:100%;padding:10px}
.icon-btn{width:34px;height:34px;padding:0;border-width:2px;box-shadow:none;font-size:15px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* ---------- 區塊 ---------- */
section{padding:28px 0 8px;scroll-margin-top:calc(var(--nav-h) + 8px)}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sec-title h2{font-size:22px}
.sec-title .chip-ico{width:40px;height:40px;display:grid;place-items:center;border:var(--line) solid var(--ink);border-radius:14px;font-size:20px;flex:none}
.sec-title .spacer{flex:1}
.card{background:var(--card);border:var(--line) solid var(--ink);border-radius:var(--radius);box-shadow:var(--pop);padding:16px;margin-bottom:16px;position:relative}
.muted{color:var(--muted);font-size:14px}
.empty{border:var(--line) dashed var(--ink);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted);margin-bottom:16px}

/* 編輯模式才出現的元件 */
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
body.editing .edit-only.block{display:flex!important}
.card-tools{position:absolute;top:10px;right:10px;gap:6px}

/* 分享唯讀橫幅 */
.banner{background:var(--water);border:var(--line) solid var(--ink);border-radius:var(--radius-sm);padding:10px 14px;margin:14px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1;min-width:200px}

/* ---------- 首頁 ---------- */
.hero{padding-top:16px}
.hero-card{background:var(--card);border:var(--line) solid var(--ink);border-radius:32px;box-shadow:var(--pop);overflow:hidden}
.hero-art{background:var(--paper);border-bottom:var(--line) solid var(--ink);line-height:0}
.hero-art svg{width:100%;height:auto;display:block}
.hero-body{padding:18px 18px 20px;text-align:center}
.hero-dest{display:inline-block;background:var(--bamboo);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px}
.hero h1{font-size:clamp(28px,8vw,40px);margin:10px 0 4px}
.hero-sub{margin:0;color:var(--muted)}
.hero-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--paper)}
.pill.yellow{background:var(--yellow)}.pill.coral{background:var(--coral)}

/* ---------- 首頁：旅程卡片 ---------- */
.home-head{background:var(--card);border:var(--line) solid var(--ink);border-radius:32px;box-shadow:var(--pop);overflow:hidden;text-align:center}
.home-head h1{font-size:clamp(28px,8vw,38px);margin:0 0 4px}
.trip-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:600px){.trip-grid{grid-template-columns:1fr 1fr}}
.trip-card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:var(--line) solid var(--ink);border-radius:var(--radius);box-shadow:var(--pop);overflow:hidden;transition:transform .18s,box-shadow .18s;animation:bounceIn .6s cubic-bezier(.3,1.5,.5,1) both}
.trip-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.trip-card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tc-art{aspect-ratio:360/160;border-bottom:var(--line) solid var(--ink);background:var(--paper);overflow:hidden;line-height:0}
.tc-art svg{width:100%;height:100%;display:block}
.tc-body{padding:12px 16px 16px;display:grid;gap:6px}
.tc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.trip-card h3{font-size:21px;word-break:break-word}
.trip-card .tc-sub{margin:0;color:var(--muted);font-size:14px}
.tc-date{font-size:14px}
.trip-card.past .tc-art{filter:saturate(.55)}
.new-card{display:grid;place-items:center;gap:6px;min-height:200px;border:var(--line) dashed var(--ink);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--muted);font-size:16px;padding:20px}
.new-card b{font-weight:normal;font-size:40px;line-height:1;color:var(--ink)}
.new-card:hover{background:var(--card)}

/* ---------- 航班 ---------- */
.flight{padding:0;overflow:hidden}
.flight-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:var(--line) solid var(--ink);padding-right:96px}
.flight-head .lbl{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px}
.flight-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:16px}
.ap{text-align:center}
.ap .code{font-size:32px;line-height:1.1;letter-spacing:.06em}
.ap .city{font-size:13px;color:var(--muted)}
.ap .time{display:inline-block;margin-top:4px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.route-mid{width:90px;display:flex;flex-direction:column;align-items:center;gap:2px}
.route-mid svg{width:90px;height:40px;overflow:visible}
.flight-foot{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 14px;border-top:2px dashed var(--ink);font-size:14px}
.flight-foot b{font-weight:normal;color:var(--muted);margin-right:4px}

/* ---------- 每日行程 ---------- */
.day-tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scrollbar-width:none;scroll-snap-type:x proximity}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:none;scroll-snap-align:start;border:var(--line) solid var(--ink);background:var(--card);border-radius:18px;padding:6px 12px;cursor:pointer;text-align:center;min-width:76px;box-shadow:2px 2px 0 var(--ink);transition:background .2s}
.day-tab .d1{display:block;font-size:13px;color:var(--muted)}
.day-tab .d2{display:block;font-size:17px}
.day-tab.on{background:var(--coral)}
.day-tab.on .d1{color:var(--ink)}
.day-tab.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.day-head{display:flex;align-items:flex-start;gap:10px;margin:6px 0 14px}
.day-head h3{font-size:20px;flex:1}
.day-head .muted{display:block}

.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:62px;top:8px;bottom:8px;border-left:var(--line) dashed var(--ink)}
.timeline.bounce > li{animation:bounceIn .6s cubic-bezier(.3,1.5,.5,1) both}
.tl-item{display:grid;grid-template-columns:50px 26px 1fr;align-items:start;gap:0;margin-bottom:14px;position:relative}
.tl-time{font-size:14px;text-align:right;padding-top:12px;padding-right:4px;white-space:nowrap}
.tl-dot{width:18px;height:18px;margin:14px auto 0;border:var(--line) solid var(--ink);border-radius:50%;background:var(--yellow);position:relative;z-index:1}
.tl-card{background:var(--card);border:var(--line) solid var(--ink);border-radius:20px;padding:10px 14px 12px;box-shadow:3px 3px 0 var(--ink);min-width:0}
.tl-card h4{font-size:17px;margin:4px 0 2px;word-break:break-word}
.tl-note{margin:2px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.tl-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;line-height:1.7;background:var(--card)}
.tag.coral{background:var(--coral)}.tag.yellow{background:var(--yellow)}.tag.water{background:var(--water)}.tag.bamboo{background:var(--bamboo)}
.map-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:0 10px;line-height:1.7;background:var(--paper)}
.map-link:hover{background:var(--water)}

/* ---------- 住宿 ---------- */
.stay h3{font-size:19px;padding-right:80px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-size:14px;padding-top:1px}
.kv dd{margin:0;word-break:break-word}
.stay-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stay-dates div{border:2px solid var(--ink);border-radius:var(--radius-sm);padding:6px 10px;background:var(--paper)}
.stay-dates small{display:block;color:var(--muted);font-size:12px}

/* ---------- 清單 ---------- */
.progress{height:16px;border:var(--line) solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;margin:2px 0 12px}
.progress span{display:block;height:100%;background:var(--bamboo);border-right:var(--line) solid var(--ink);transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.progress span[style*="width: 0%"],.progress span[style*="width:0%"]{border-right:0}
.checklist{list-style:none;margin:0;padding:0}
.check{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed #E7E1D8}
.check:last-child{border-bottom:0}
.check label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;border:var(--line) solid var(--ink);border-radius:9px;background:var(--card);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.check input::after{content:"";width:10px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) scale(0);margin-top:-3px;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.check input:checked{background:var(--bamboo)}
.check input:checked::after{transform:rotate(-45deg) scale(1)}
.check input:checked + span{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.check span{word-break:break-word}
.group-title{display:inline-block;margin:12px 0 2px;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--water)}
.group-title:first-of-type{margin-top:0}
.add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add-row input,.add-row select{flex:1;min-width:120px;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:var(--paper)}
.add-row .btn{flex:none}

/* ---------- 工具 ---------- */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tools-grid .btn{width:100%;padding:10px}
.tip{font-size:14px;color:var(--muted);margin:10px 0 0}
.tip li{margin-bottom:4px}
footer{text-align:center;padding:30px 0 50px;color:var(--muted);font-size:13px}

/* ---------- 對話框 ---------- */
dialog{border:var(--line) solid var(--ink);border-radius:var(--radius);background:var(--paper);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:var(--pop);color:var(--ink)}
dialog::backdrop{background:rgba(62,58,57,.35)}
dialog[open]{animation:sheetIn .35s cubic-bezier(.3,1.4,.5,1)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:var(--line) solid var(--ink);background:var(--yellow);position:sticky;top:0;z-index:1}
.dlg-head h3{flex:1;font-size:18px}
.dlg-body{padding:14px 16px;display:grid;gap:12px}
.field{display:grid;gap:4px}
.field span{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--card);min-height:42px}
.field textarea{min-height:80px;resize:vertical}
.field.check-field{display:flex;align-items:center;gap:8px}
.field.check-field input{width:22px;height:22px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px}
.share-box{width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px;background:var(--card);font-size:13px;word-break:break-all;max-height:120px;overflow:auto}
@media (max-width:520px){
  dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:var(--radius) var(--radius) 0 0;border-bottom:0;max-height:92dvh}
  .row2.stack-sm{grid-template-columns:1fr}
}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:calc(100vw - 32px);animation:toastIn .35s cubic-bezier(.3,1.5,.5,1)}
.toast .btn{background:var(--yellow);color:var(--ink);border-color:var(--paper);box-shadow:none;padding:2px 12px;font-size:13px}

/* =========================================================
   動畫
   ========================================================= */
@keyframes bounceIn{0%{opacity:0;transform:translateY(24px) scale(.96)}60%{opacity:1;transform:translateY(-6px) scale(1.01)}80%{transform:translateY(2px)}100%{transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-3deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes driftX{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes driftX2{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes rideX{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes wave{to{transform:translateX(-40px)}}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-30px,120px) rotate(200deg);opacity:0}}
@keyframes blink{0%,92%,100%{opacity:1}96%{opacity:.2}}

.a-float{animation:floatY 3.2s ease-in-out infinite}
.a-drift{animation:driftX 9s ease-in-out infinite}
.a-drift2{animation:driftX2 11s ease-in-out infinite}
.a-spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.a-spin-slow{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
.a-sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.a-ride{animation:rideX 6s ease-in-out infinite}
.a-wave{animation:wave 3s linear infinite}
.a-fall{animation:fall 7s linear infinite}
.a-blink{animation:blink 4s infinite}
.d1s{animation-delay:-1s}.d2s{animation-delay:-2.5s}.d3s{animation-delay:-4s}.d4s{animation-delay:-5.5s}

/* 系統「減少動態效果」或頁面內關閉動畫 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
html.no-motion *,html.no-motion *::before,html.no-motion *::after{animation:none!important;transition:none!important}
html.no-motion{scroll-behavior:auto}

@media (min-width:640px){
  :root{--nav-h:108px}
  .timeline::before{left:72px}
  .tl-item{grid-template-columns:60px 26px 1fr}
  .tl-time{font-size:15px}
}
@media print{

const CFG = window.TRIP_CONFIG || {};
const EDITORS = (CFG.editors || []).map(e => String(e).trim().toLowerCase()).filter(e => e && !e.startsWith("你的"));
const CLOUD = !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId);
const embedded = JSON.parse($("#trip-data").textContent);
const SAMPLE = clone(embedded);
const LOCAL_KEY = "tripsLocal";       // 單機模式：所有旅程
const CACHE_KEY = "tripsCache";       // 雲端模式：快取，打開時先顯示
const CHECK_KEY = id => "tripChecks:" + id;  // 每個人自己的打勾紀錄

let trips = {};                  // 旅程代號 → 行程資料
let currentId = null, data = null, checksFor = null;
let editing = false, activeDay = null, checks = {};
let canEdit = !CLOUD;            // 單機模式可直接編輯；雲端模式要登入
let user = null, fb = null, listLoaded = !CLOUD, syncState = "";
const lastJson = {}, saveTimers = {};

function todayStr(){ return addDays(null, 0); }
function blankTrip(){
  const t = addDays(null, 30);
  return {v:2,title:"我的旅行",subtitle:"寫一句旅行的小目標",dest:"目的地",theme:"japan",start:t,end:addDays(t,2),
    flights:[],days:[0,1,2].map(i=>({id:uid(),date:addDays(t,i),title:"",items:[]})),stays:[],todos:[],predepart:[],luggage:[]};
}
function normalize(d){
  const b = blankTrip();
  for(const k of Object.keys(b)) if(d[k] === undefined) d[k] = b[k];
  ["todos","predepart","luggage"].forEach(k => d[k].forEach(it => { delete it.done; }));
  delete d.lockEdit; delete d.updatedAt; delete d.id;
  return d;
}
function daysFor(start, end){
  const n = start && end ? dayDiff(start, end) + 1 : 0;
  return n > 0 ? Array.from({length:Math.min(n,60)}, (_,i) => ({id:uid(),date:addDays(start,i),title:"",items:[]})) : [];
}
function newTripId(){ return "t" + Date.now().toString(36) + uid().slice(0,3); }
function readJSON(key){ try{ const s = store.get(key); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function persist(){
  const out = {}; for(const [id,d] of Object.entries(trips)) out[id] = JSON.stringify(d);
  store.set(CLOUD ? CACHE_KEY : LOCAL_KEY, JSON.stringify(out));
}

function load(){
  const saved = readJSON(CLOUD ? CACHE_KEY : LOCAL_KEY);
  if(saved) for(const [id,j] of Object.entries(saved)){ try{ trips[id] = normalize(JSON.parse(j)); lastJson[id] = j; }catch(e){} }
  if(!CLOUD){
    // 舊版單機資料搬過來
    const old = readJSON("tripLocal:my-trip");
    if(old && !trips["my-trip"]) trips["my-trip"] = normalize(old);
    if(!Object.keys(trips).length) trips["sample-tokyo"] = normalize(clone(embedded));
    persist();
  } else if(saved) listLoaded = true;
}

function setSync(state){
  syncState = state;
  const pill = $("#syncPill");
  const map = {saving:"☁️ 儲存中…", saved:"☁️ 已同步", error:"⚠️ 未儲存", offline:"📴 離線"};
  pill.textContent = map[state] || "";
  pill.classList.toggle("hidden", !(CLOUD && canEdit && map[state]));
}

/* 存一趟旅程（雲端模式會稍等一下再一起送出） */
function writeTrip(id, d, now){
  trips[id] = d; persist();
  if(!CLOUD || !canEdit || !fb) return;
  const json = JSON.stringify(d);
  setSync("saving");
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(async () => {
    try{
      lastJson[id] = json;
      await fb.setDoc(fb.doc(fb.db, "trips", id), {json, updatedAt: fb.serverTimestamp(), updatedBy: user?.email || ""});
      setSync("saved");
    }catch(err){
      console.error(err); setSync("error");
      toast(err.code === "permission-denied" ? "沒有寫入權限：請確認 Firestore 規則裡的 Email" : "儲存失敗，請檢查網路");
    }
  }, now ? 0 : 500);
}
function save(){ if(currentId && data) writeTrip(currentId, data); }
async function removeTrip(id){
  delete trips[id]; persist();
  if(CLOUD && fb){ try{ await fb.deleteDoc(fb.doc(fb.db, "trips", id)); }catch(err){ console.error(err); toast("刪除失敗：" + (err.code || "")); } }
}
function saveChecks(){ if(currentId) store.set(CHECK_KEY(currentId), JSON.stringify(checks)); }

const SDK = "https://www.gstatic.com/firebasejs/12.18.0/";
async function initCloud(){
  try{
    const [appM, fsM, authM] = await Promise.all([
      import(SDK + "firebase-app.js"), import(SDK + "firebase-firestore.js"), import(SDK + "firebase-auth.js")
    ]);
    const app = appM.initializeApp(CFG.firebase);
    const db = fsM.getFirestore(app);
    const auth = authM.getAuth(app);
    fb = {...fsM, ...authM, auth, db};

    fsM.onSnapshot(fsM.collection(db, "trips"), snap => {
      $("#loadingBanner").classList.add("hidden");
      const next = {}; let changed = !listLoaded;
      snap.docs.forEach(docu => {
        const id = docu.id;
        if(docu.metadata.hasPendingWrites && trips[id]){ next[id] = trips[id]; return; }
        const j = docu.data().json; if(!j) return;
        if(j === lastJson[id] && trips[id]){ next[id] = trips[id]; return; }
        try{ next[id] = normalize(JSON.parse(j)); lastJson[id] = j; changed = true; }catch(e){ console.error(e); }
      });
      if(Object.keys(next).length !== Object.keys(trips).length) changed = true;
      listLoaded = true;
      if(!changed) return;
      trips = next; persist(); route();
    }, err => {
      console.error(err);
      $("#loadingBanner").classList.add("hidden");
      listLoaded = true; route();
      toast(err.code === "permission-denied" ? "讀取被拒：請確認 Firestore 規則已發布" : "連不上雲端，先顯示上次的內容");
    });

    authM.onAuthStateChanged(auth, u => {
      user = u;
      const email = (u?.email || "").toLowerCase();
      canEdit = !!u && EDITORS.includes(email);
      if(!canEdit) editing = false;
      if(u && !canEdit) toast(`${u.email} 沒有編輯權限`);
      setSync(canEdit ? (syncState || "saved") : "");
      render();
    });
    addEventListener("offline", () => canEdit && setSync("offline"));
    addEventListener("online", () => canEdit && setSync("saved"));
  }catch(err){
    console.error(err);
    $("#loadingBanner").classList.add("hidden");
    listLoaded = true; route();
    toast("Firebase 載入失敗，請檢查設定");
  }
}

function tripParam(){ return new URLSearchParams(location.search).get("trip"); }
function route(){
  const id = tripParam();
  currentId = id || null;
  data = id ? (trips[id] || null) : null;
  if(id && id !== checksFor){ checks = readJSON(CHECK_KEY(id)) || {}; checksFor = id; activeDay = null; }
  if(id && !data && listLoaded){
    toast("找不到這趟旅程，回到首頁");
    history.replaceState(null, "", location.pathname);
    currentId = null;
  }
  render();
}
function go(id){
  editing = false;
  history.pushState(null, "", id ? "?trip=" + encodeURIComponent(id) : location.pathname);
  route();
  scrollTo({top:0, behavior:"auto"});
}

function tripStatus(d){
  if(!d.start) return {txt:"📅 日期未定", cls:"", past:false};
  const t = todayStr(), left = dayDiff(t, d.start), end = d.end || d.start;
  if(left > 0) return {txt:`⏳ 再 ${left} 天出發！`, cls:"coral", past:false};
  if(left === 0) return {txt:"🎉 今天出發！", cls:"coral", past:false};
  if(dayDiff(t, end) >= 0) return {txt:`🎒 旅行中・第 ${1-left} 天`, cls:"coral", past:false};
  return {txt:"📷 旅程結束，留下好回憶", cls:"", past:true};
}
function dateRange(d){
  if(!d.start) return "";
  const n = d.end ? dayDiff(d.start, d.end) + 1 : 0;
  return `${fmtDate(d.start,true)}${d.end && d.end !== d.start ? " – " + fmtDate(d.end) : ""}${n > 0 ? `・${n} 天 ${Math.max(n-1,0)} 夜` : ""}`;
}

const LIST_CONF = {
  todos:{empty:"還沒有待辦事項", ph:"例如：預約餐廳"},
  predepart:{empty:"還沒有出發前要做的事", ph:"例如：線上報到"},
  luggage:{empty:"還沒有行李項目", ph:"例如：充電線", grouped:true}
};
function isDone(item){ return !!checks[item.id]; }
function renderList(key){
  const el = $("#list-" + key), list = data[key], conf = LIST_CONF[key];
  const done = list.filter(isDone).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  const row = it => `<li class="check"><label><input type="checkbox" data-list="${key}" data-id="${it.id}" ${isDone(it)?"checked":""}><span>${esc(it.text)}</span></label><button class="btn icon-btn edit-only" data-act="del-check" data-list="${key}" data-id="${it.id}" aria-label="刪除">✕</button></li>`;
  let body;
  if(!list.length) body = `<p class="muted" style="margin:0">${conf.empty}</p>`;
  else if(conf.grouped){
    const groups = {};
    list.forEach(it => (groups[it.cat || "其他"] ||= []).push(it));
    body = Object.entries(groups).map(([g,items]) => `<span class="group-title">${esc(g)}</span><ul class="checklist">${items.map(row).join("")}</ul>`).join("");
  } else body = `<ul class="checklist">${list.map(row).join("")}</ul>`;
  const cats = conf.grouped ? [...new Set(list.map(i=>i.cat||"其他"))] : [];
  el.innerHTML = `
    <div class="tl-row" style="justify-content:space-between"><span class="muted">完成 ${done} / ${list.length}</span><span class="muted">${pct}%</span></div>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    ${body}
    <form class="add-row edit-only block" data-add="${key}">
      <input name="text" placeholder="${conf.ph}" aria-label="新增項目" required>
      ${conf.grouped ? `<input name="cat" placeholder="分類（例如：衣物）" list="cats-${key}" aria-label="分類"><datalist id="cats-${key}">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>` : ""}

    </form>`;
}

const dlg = $("#dlg");
function openForm({title, fields, values={}, onSave, saveText="儲存"}){
  const f = (fd) => {
    const v = values[fd.k] ?? fd.def ?? "";
    let input;
    if(fd.type === "select") input = `<select name="${fd.k}">${Object.entries(fd.options).map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if(fd.type === "textarea") input = `<textarea name="${fd.k}" placeholder="${esc(fd.ph||"")}">${esc(v)}</textarea>`;
    else if(fd.type === "checkbox") return `<label class="field check-field"><input type="checkbox" name="${fd.k}" ${v?"checked":""}><span>${esc(fd.label)}</span></label>`;
    else input = `<input type="${fd.type||"text"}" name="${fd.k}" value="${esc(v)}" placeholder="${esc(fd.ph||"")}" ${fd.req?"required":""} ${fd.type==="text"&&fd.upper?'style="text-transform:uppercase"':""}>`;
    return `<label class="field"><span>${esc(fd.label)}</span>${input}</label>`;
  };
  const body = fields.map(fd => Array.isArray(fd) ? `<div class="row2 ${fd.stack?"stack-sm":""}">${fd.map(f).join("")}</div>` : f(fd)).join("");
  dlg.innerHTML = `<form method="dialog" id="dlgForm">
    <div class="dlg-head"><h3>${esc(title)}</h3><button type="button" class="btn icon-btn" data-close aria-label="關閉">✕</button></div>
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>取消</button><button class="btn coral" type="submit">${esc(saveText)}</button></div>
  </form>`;
  const form = $("#dlgForm");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const out = {};
    fields.flat().forEach(fd => { const el = form.elements[fd.k]; out[fd.k] = fd.type==="checkbox" ? el.checked : el.value.trim(); if(fd.upper) out[fd.k] = out[fd.k].toUpperCase(); });
    onSave(out); dlg.close(); save(); render();
  });
  $$("[data-close]", dlg).forEach(b => b.onclick = () => dlg.close());
  dlg.showModal();
  const first = $("input,select,textarea", form); if(first && window.innerWidth > 520) first.focus();
}

/* ---------- 提示 & 復原 ---------- */
let toastTimer;
function toast(msg, undo){
  $$(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="btn">復原</button>' : ""}`;
  if(undo) $("button", t).onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 5000 : 2600);
}
function removeWithUndo(arr, id, label){
  const i = arr.findIndex(x => x.id === id); if(i < 0) return;
  const [item] = arr.splice(i, 1);
  save(); render();
  toast(`已刪除「${label(item)}」`, () => { arr.splice(i, 0, item); save(); render(); });
}

function downloadFile(text, name, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type + ";charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const mq = matchMedia("(prefers-reduced-motion: reduce)");
function motionOK(){ return !mq.matches && !document.documentElement.classList.contains("no-motion"); }
function setMotion(off){
  document.documentElement.classList.toggle("no-motion", off);
  $("#motionBtn").textContent = (off || mq.matches) ? "🌀 動畫：關" : "🌀 動畫：開";
}

});
$("#dayTabs").addEventListener("animationend", e => e.target.classList.remove("pop"));

/* 選單：捲動時標示目前區塊 */
function setNavH(){ document.documentElement.style.setProperty("--nav-h", $("#nav").offsetHeight + "px"); }
setNavH(); addEventListener("resize", setNavH);
if("IntersectionObserver" in window){
  const links = $$("#navLinks a");
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if(en.isIntersecting){
      links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id));
      const on = links.find(a => a.classList.contains("on")); if(on) on.scrollIntoView({block:"nearest",inline:"center",behavior:"auto"});
    }});
  }, {rootMargin:"-45% 0px -50% 0px"});
  $$("main section").forEach(s => io.observe(s));
}

/* ---------- 開始 ---------- */
load();
history.scrollRestoration = "manual";
setMotion(store.get("tripTemplate:noMotion") === "1");
mq.addEventListener?.("change", () => setMotion(document.documentElement.classList.contains("no-motion")));
route();
if(CLOUD) initCloud();
})();
</script>
